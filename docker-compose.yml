version: "3.9"

# =============================================================================
# OceanWatch AI — Docker Compose (local development)
# =============================================================================
# Usage:
#   docker-compose up --build          # start all services
#   docker-compose up db               # start only the database
#   docker-compose down -v             # stop & remove volumes
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS (geospatial-enabled database)
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: oceanwatch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oceanwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oceanwatch_secret}
      POSTGRES_DB: ${POSTGRES_DB:-oceanwatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oceanwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (optional — for Celery task queue / alert jobs)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: oceanwatch_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oceanwatch_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oceanwatch}:${POSTGRES_PASSWORD:-oceanwatch_secret}@db:5432/${POSTGRES_DB:-oceanwatch}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./models:/app/models:ro
      - ./data/processed:/app/data/processed:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ---------------------------------------------------------------------------
  # React Frontend (dev server)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oceanwatch_frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # prevent host node_modules from overriding
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: oceanwatch_network
